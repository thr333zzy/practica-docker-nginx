<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hola mundo</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f1ea;
        --ink: #1c1915;
        --muted: #5c564c;
        --card: #fffdf8;
        --line: #e4ddd0;
        --accent: #0f6e56;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141311;
          --ink: #f3efe6;
          --muted: #b7b0a4;
          --card: #1e1c19;
          --line: #34302a;
          --accent: #3ecf8e;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
        background:
          radial-gradient(circle at top, rgba(15, 110, 86, 0.12), transparent 42%),
          var(--bg);
        color: var(--ink);
      }
      main {
        width: min(100%, 640px);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 40px 36px;
      }
      p { line-height: 1.5; }
      .eyebrow {
        margin: 0 0 12px;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 0.78rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
      }
      h1 {
        margin: 0 0 16px;
        font-size: clamp(2.6rem, 8vw, 4.2rem);
        line-height: 0.95;
      }
      .note {
        margin: 0;
        color: var(--muted);
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 1rem;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.92em;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">nginx · docker compose</p>
      <h1>Hola mundo</h1>
      <p class="note">
        Esta página sale de <code>src/index.html</code>, montado en el contenedor en
        <code>/usr/share/nginx/html</code>.
      </p>
    </main>
  </body>
</html>
